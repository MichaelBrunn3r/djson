[package]
name = "djson"
version = "0.1.0"
edition = "2024"

[[bench]]
name = "parse_uint"
harness = false

[[bench]]
name = "parse_str"
harness = false

[[bench]]
name = "cmp_parse_uint"
harness = false

[[bench]]
name = "cmp_parse_utf16_escapes"
harness = false

[features]
default = ["serde"]
serde = ["dep:serde"]

[dependencies]
serde = {workspace = true, optional = true}
thiserror = {workspace = true}
miette = {workspace = true}

[dev-dependencies]
criterion = {workspace = true}
bumpalo = {workspace = true}
insta = {workspace = true}
rand = {workspace = true}
serde_state = {workspace = true}

[lints]
workspace = true